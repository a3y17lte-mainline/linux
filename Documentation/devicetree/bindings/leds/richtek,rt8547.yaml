%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/richtek,rt8547.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Richtek RT8547 1.6 A flash LED driver

maintainers:
  - Martin Štrobl <recordyletsplays@gmail.com>

description: |
  The RT8547 is a boost flash LED driver for one LED, with separate torch
  (25 mA to 400 mA) and strobe (100 mA to 1.6 A) currents and a strobe
  safety timer. Its registers are written through a one-wire interface on
  the FLSET pin; holding FLSET low for 1.5 ms shuts the chip down. The FLEN
  pin turns the LED on in the mode and at the current set by the registers.

properties:
  compatible:
    const: richtek,rt8547

  flset-gpios:
    maxItems: 1
    description: GPIO connected to the FLSET (one-wire control) pin.

  flen-gpios:
    maxItems: 1
    description: GPIO connected to the FLEN (LED enable) pin.

  vin-supply:
    description: Power supply for the VIN pin (2.8 V to 5.5 V).

  led:
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false

    properties:
      led-max-microamp:
        minimum: 25000
        maximum: 400000
        description: Maximum torch current, set in 25 mA steps.

      flash-max-microamp:
        minimum: 100000
        maximum: 1600000
        description: Maximum strobe current, set in 50 mA steps.

      flash-max-timeout-us:
        minimum: 64000
        maximum: 1216000
        description: Maximum strobe duration, set in 32 ms steps.

    required:
      - led-max-microamp
      - flash-max-microamp
      - flash-max-timeout-us

required:
  - compatible
  - flset-gpios
  - flen-gpios
  - led

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/leds/common.h>

    led-controller {
        compatible = "richtek,rt8547";
        flset-gpios = <&gpd3 3 GPIO_ACTIVE_HIGH>;
        flen-gpios = <&gpd3 2 GPIO_ACTIVE_HIGH>;

        led {
            function = LED_FUNCTION_FLASH;
            color = <LED_COLOR_ID_WHITE>;
            led-max-microamp = <125000>;
            flash-max-microamp = <1200000>;
            flash-max-timeout-us = <1216000>;
        };
    };
...
