%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/audio-graph-card2.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Audio Graph Card2

maintainers:
  - Kuninori Morimoto <kuninori.morimoto.gx@renesas.com>

properties:
  compatible:
    enum:
      - audio-graph-card2
  links:
    $ref: /schemas/types.yaml#/definitions/phandle-array
  label:
    maxItems: 1
  routing:
    $ref: audio-graph.yaml#/properties/routing
  aux-devs:
    description: |
      List of phandles pointing to auxiliary devices, such
      as amplifiers, to be added to the sound card.
    $ref: /schemas/types.yaml#/definitions/phandle-array
  multi:
    type: object
    description: Multi-CPU/Codec node
  dpcm:
    type: object
    description: DPCM node
  codec2codec:
    type: object
    description: Codec to Codec node
    properties:
      ports:
        type: object
        properties:
          rate:
            $ref: /schemas/types.yaml#/definitions/uint32
            description: fixed sample rate of the Codec to Codec link
  hp-det-gpios:
    $ref: audio-graph.yaml#/properties/hp-det-gpios
  mic-det-gpios:
    $ref: audio-graph.yaml#/properties/mic-det-gpios
  widgets:
    $ref: audio-graph.yaml#/properties/widgets
  pin-switches:
    description: the widget names for which pin switches must be created.
    $ref: /schemas/types.yaml#/definitions/string-array

required:
  - compatible
  - links

additionalProperties: false

...
