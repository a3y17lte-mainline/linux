%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/samsung,exynos7870-audmixer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung Exynos7870 audio mixer

maintainers:
  - Martin Štrobl <recordyletsplays@gmail.com>

description: |
  The audio mixer (S1402X) in the DISPAUD block of the Exynos7870 sits
  between the SoC I2S controllers and the external audio codec. It mixes
  and resamples the streams of its inputs (application processor, modem,
  Bluetooth) and drives the I2S bus towards the codec as bus master. It
  also provides the master clock of the codec on the MCLK pin.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: samsung,exynos7870-audmixer

  reg:
    maxItems: 1

  clocks:
    items:
      - description: register bus clock
      - description: mixer system clock

  clock-names:
    items:
      - const: pclk
      - const: sysclk

  resets:
    maxItems: 1

  '#clock-cells':
    const: 0
    description: the codec master clock output (MCLK pin)

  clock-output-names:
    maxItems: 1

  '#sound-dai-cells':
    const: 1
    description: |
      0 = the application processor interface (to the SoC I2S controller),
      1 = the codec interface (the external I2S bus)

  samsung,pmu-syscon:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: PMU system controller, holding the mixer power control bit

  port:
    $ref: audio-graph-port.yaml#
    unevaluatedProperties: false

  ports:
    $ref: /schemas/graph.yaml#/properties/ports

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - '#clock-cells'
  - '#sound-dai-cells'
  - samsung,pmu-syscon

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/samsung,exynos7870-cmu.h>

    audio-mixer@14880000 {
        compatible = "samsung,exynos7870-audmixer";
        reg = <0x14880000 0x200>;
        clocks = <&cmu_dispaud CLK_GOUT_DISPAUD_APB_AUD>,
                 <&cmu_dispaud CLK_GOUT_DISPAUD_MIXER_AUD_SYSCLK>;
        clock-names = "pclk", "sysclk";
        resets = <&dispaud_reset 0>;
        #clock-cells = <0>;
        #sound-dai-cells = <1>;
        samsung,pmu-syscon = <&pmu_system_controller>;
        pinctrl-0 = <&i2s_pmic_amp_bus>;
        pinctrl-1 = <&i2s_pmic_amp_bus_idle>;
        pinctrl-names = "default", "sleep";
    };
